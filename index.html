<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flamakesdesign | Home</title>
    <meta name="description" content="Portfólio criativo da Flamakesdesign." />
    <link rel="icon" type="image/png" href="static/favicon@3x.png" />
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body data-title-pt="Flamakesdesign | Home" data-title-en="Flamakesdesign | Home">
    <header class="site-wrap topbar">
      <a class="logo-link" href="index.html" aria-label="Voltar para home">
        <img src="static/flamakesdesign.png" alt="Logo Fla makes design" />
      </a>
      <div class="lang-switch" role="group" aria-label="Selecionar idioma">
        <button class="lang-btn is-active" data-lang="pt" type="button">PT</button>
        <button class="lang-btn" data-lang="en" type="button">ENG</button>
      </div>
    </header>

    <main class="site-wrap main-home">
      <section class="hero-box" id="pierreBox">
        <div class="pierre-speech" id="pierreSpeech" aria-live="polite">
          <button class="speech-close" id="pierreSpeechClose" type="button" aria-label="Fechar balão">
            x
          </button>
          <p id="pierreSpeechText"></p>
          <p class="speech-hint" data-i18n="home.speechHint">você pode fechar esta aba no x</p>
        </div>
        <div class="pierre-wrap">
          <img
            id="pierreCharacter"
            src="static/pierre.png"
            alt="Ilustração do Pierre"
            role="button"
            tabindex="0"
            aria-label="Clique no Pierre para uma mensagem"
          />
        </div>
      </section>

      <div class="home-nav-wrap">
        <nav class="nav-grid" aria-label="Navegação principal">
          <a class="nav-card" href="sobre.html" data-i18n="nav.about">sobre mim</a>
          <a class="nav-card" href="portfolio.html" data-i18n="nav.portfolio">portfólio</a>
          <a class="nav-card" href="servicos.html" data-i18n="nav.services">serviços</a>
          <a class="nav-card" href="processo.html" data-i18n="nav.process">processo</a>
          <a class="nav-card" href="loja.html" data-i18n="nav.shop">loja</a>
          <a class="nav-card" href="contato.html" data-i18n="nav.contact">contato</a>
        </nav>
        <div class="home-nav-under">
          <p class="home-mini-note">Flamakesdesign, 2026. :)</p>
          <div class="home-social-icons" aria-label="Redes sociais">
            <a href="https://wa.link/auk0r0" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
              <img src="static/whatsapp.png" alt="" />
            </a>
            <a
              href="https://www.linkedin.com/in/flamakesdesign"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <img src="static/linkedin.png" alt="" />
            </a>
            <a href="https://www.instagram.com/flavi.dsg/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <img src="static/instagram.png" alt="" />
            </a>
            <a href="mailto:flaviamsara@gmail.com" aria-label="Gmail">
              <img src="static/gmail.png" alt="" />
            </a>
            <a href="https://x.com/Flamakesdesign" target="_blank" rel="noopener noreferrer" aria-label="X">
              <img src="static/twitter.png" alt="" />
            </a>
            <a href="https://www.behance.net/mariaaraujo37" target="_blank" rel="noopener noreferrer" aria-label="Behance">
              <img src="static/behance.png" alt="" />
            </a>
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
              <img src="static/youtube.png" alt="" />
            </a>
          </div>
        </div>
      </div>
    </main>

    <script src="static/script.js"></script>

</html>
