<!doctype html>
<html lang="pt-BR">
  <head>

    <link rel="icon" type="image/png" href="static/favicon@3x.png" />

  </head>
  <body data-title-pt="Contato | Flamakesdesign" data-title-en="Contact | Flamakesdesign">

      <a class="logo-link" href="index.html" aria-label="Voltar para home">
        <img src="static/flamakesdesign.png" alt="Logo Fla makes design" />

      <div class="lang-switch" role="group" aria-label="Selecionar idioma">
        <button class="lang-btn is-active" data-lang="pt" type="button">PT</button>
        <button class="lang-btn" data-lang="en" type="button">ENG</button>
      </div>
    </header>
    <main class="site-wrap page-shell">
      <section class="content-card contact-shell">
        <h1 data-i18n="page.contact.title">contato</h1>
        <div class="contact-panel" aria-label="Redes e contatos">
          <a class="contact-link" href="https://wa.link/auk0r0" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <img src="static/whatsapp.png" alt="" />
            <span>WhatsApp</span>
          </a>
          <a
            class="contact-link"
            href="https://www.linkedin.com/in/flamakesdesign"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <img src="static/linkedin.png" alt="" />
            <span>LinkedIn</span>
          </a>
          <a
            class="contact-link"
            href="https://www.instagram.com/flavi.dsg/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="static/instagram.png" alt="" />
            <span>Instagram</span>
          </a>
          <a class="contact-link" href="mailto:flaviamsara@gmail.com" aria-label="Gmail">
            <img src="static/gmail.png" alt="" />
            <span>Gmail</span>
          </a>
          <a class="contact-link" href="https://x.com/Flamakesdesign" target="_blank" rel="noopener noreferrer" aria-label="X">
            <img src="static/twitter.png" alt="" />
            <span>X</span>
          </a>
          <a

            href="https://www.behance.net/mariaaraujo37"

          >
            <img src="static/behance.png" alt="" />
            <span>Behance</span>
          </a>
        </div>
      </section>
      <p class="footer-note"><a href="index.html" data-i18n="common.backHome">voltar para home</a></p>

    <script src="static/script.js"></script>
