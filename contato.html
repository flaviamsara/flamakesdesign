<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Flamakesdesign</title>
    <link rel="icon" type="image/png" href="static/favicon@3x.png" />
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body data-title-pt="Contato | Flamakesdesign" data-title-en="Contact | Flamakesdesign">
    <header class="site-wrap topbar">
      <a class="logo-link" href="index.html" aria-label="Voltar para home">
        <img src="static/flamakesdesign.png" alt="Logo Fla makes design" />
      </a>
      <div class="lang-switch" role="group" aria-label="Selecionar idioma">
        <button class="lang-btn is-active" data-lang="pt" type="button">PT</button>
        <button class="lang-btn" data-lang="en" type="button">ENG</button>
      </div>
    </header>
    <main class="site-wrap page-shell">
      <section class="content-card contact-shell">
        <h1 data-i18n="page.contact.title">contato</h1>
        <p class="contact-subtitle">clique nos círculos para falar comigo</p>
        <div class="contact-circles" aria-label="Redes e contatos">
          <a class="contact-bubble" href="https://wa.me/" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <span class="contact-icon">WA</span>
            <span class="contact-label">WhatsApp</span>
          </a>
          <a
            class="contact-bubble"
            href="https://www.linkedin.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <span class="contact-icon">in</span>
            <span class="contact-label">LinkedIn</span>
          </a>
          <a class="contact-bubble" href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <span class="contact-icon">GH</span>
            <span class="contact-label">GitHub</span>
          </a>
          <a
            class="contact-bubble"
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <span class="contact-icon">IG</span>
            <span class="contact-label">Instagram</span>
          </a>
          <a class="contact-bubble" href="mailto:flaviamsara@gmail.com" aria-label="Gmail">
            <span class="contact-icon">@</span>
            <span class="contact-label">Gmail</span>
          </a>
          <a class="contact-bubble" href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X">
            <span class="contact-icon">X</span>
            <span class="contact-label">X</span>
          </a>
          <a
            class="contact-bubble"
            href="https://www.behance.net/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Behance"
          >
            <span class="contact-icon">Be</span>
            <span class="contact-label">Behance</span>
          </a>
        </div>
      </section>
      <p class="footer-note"><a href="index.html" data-i18n="common.backHome">voltar para home</a></p>
    </main>
    <script src="static/script.js"></script>
  </body>
</html>
